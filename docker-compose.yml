services:
  web:
    build:
      context: .
      dockerfile: src/Documato.Web/Dockerfile
    image: documato-web:local
    container_name: documato-web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - mssql
      - chromadb
    restart: unless-stopped

  mssql:
    image: mcr.microsoft.com/mssql/azure-sql-db-server:latest
    platform: linux/arm64
    container_name: documato-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-DocumatoDev!2026}"
    ports:
      - "1433:1433"
    volumes:
      - azure-sql-data:/var/opt/mssql
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: documato-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    restart: unless-stopped

volumes:
  azure-sql-data:
  chroma-data:
